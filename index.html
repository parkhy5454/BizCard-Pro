<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <title>BizCard Pro AI</title>

    <!-- [추가] PWA(홈 화면 추가, 전체화면 실행) 설정. manifest는 아이콘/앱이름/실행모드를
    정의하고, 나머지 meta 태그들은 iOS Safari가 manifest를 완전히 지원하지 않아서
    "홈 화면에 추가"했을 때 상태바 색상/아이콘/앱이름이 제대로 나오도록 별도로 지정한다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6247DD" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />

    <!-- iOS Safari 전용: 홈 화면에 추가했을 때 전체화면(주소창 없이)으로 실행되고,
    상태바가 앱 테마에 맞게 나오도록 지정. Android/Chrome은 위 manifest만으로 충분하다. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BizCard Pro" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!-- 토스페이먼츠 결제창 SDK (구독/자동결제용) -->
    <script src="https://js.tosspayments.com/v1/payment"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
