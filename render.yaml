services:
  - type: web
    name: bizcard-pro
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
    disk:
      name: bizcard-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /
    autoDeploy: true
